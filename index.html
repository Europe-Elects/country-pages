<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europe Elects – Country page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F7F6F2;--line:#E4E2DB;--line2:#ECEAE4;--navy:#1B2A4A;--blue:#2A5DB0;--gold:#F2B705;--ink:#1A1D23;--muted:#565B66;--chip:#EFEDE7;--tag:#E7EEF9;--tagInk:#1E4C99}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:'Advent Pro',system-ui,sans-serif;font-size:16px;color:var(--ink);line-height:1.35}
a{color:var(--tagInk)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-direction:column;align-items:center;gap:14px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
h1.country{margin:0;padding:12px 40px;background:var(--navy);color:#fff;font-size:30px;line-height:1;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.lead{align-self:stretch;border-top:4px solid var(--blue);border-radius:8px;padding:4px 22px}
.lead-row{padding:14px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.lead-row:last-child{border-bottom:0}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.tagb{padding:3px 9px;border-radius:4px;background:var(--tag);color:var(--tagInk);font-size:13px;font-weight:600}
.partyb{padding:3px 9px;border-radius:999px;background:#fff;border:1px solid #D5D3CC;font-size:14px;font-weight:600}
.name{font-size:21px;font-weight:700}
.bar{background:var(--navy);color:#fff;padding:12px 18px;border-radius:4px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;margin-top:12px}
.bar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bar .note{font-size:14px;color:#D6DCE8}
.bar a{font-size:15px;font-weight:600;color:var(--gold);text-decoration:none}
.bar a:hover{text-decoration:underline}
.badge{padding:3px 12px;border-radius:999px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.grid-e{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.elec{overflow:hidden;display:flex;flex-direction:column}
.elec .type{padding:7px 14px;color:#fff;font-size:14px;font-weight:700}
.elec .body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.big{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.parl{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.parl .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.seatwrap{position:relative}
.seatbar{display:flex;height:28px;border-radius:4px;overflow:hidden;background:#ECEAE4}
.seatbar div{min-width:0;box-shadow:inset -1px 0 0 #fff;transition:flex-grow .9s ease}
@media (prefers-reduced-motion: reduce){.seatbar div{transition:none}}
.parl-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
button.play{display:inline-flex;align-items:center;gap:8px}
.yrbtns{display:flex;flex-wrap:wrap;gap:4px}
.yrbtn{min-height:44px;min-width:56px;padding:0 10px;border:1px solid #D5D3CC;border-radius:6px;background:#fff;color:var(--ink);font:600 16px 'Advent Pro',system-ui,sans-serif;cursor:pointer}
.yrbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.yrbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.majline{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.poll{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.poll iframe{width:0;min-width:100%;border:none}
.poll p{margin:0;font-size:13px;font-style:italic;color:var(--muted)}
.grid-a{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.grid-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,176px),1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:9px;padding:11px 14px 13px;border:1px solid var(--line);border-top:5px solid #8A9099;border-radius:6px;background:#fff}
.tile.small{gap:6px;padding:9px 11px 10px;border-top-width:4px}
.tile .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.logo{display:block;flex:none;width:auto;object-fit:contain}
.abbr{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small .abbr{font-size:18px}
.yr{font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tile h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.small h3{font-size:15px;font-weight:600;line-height:1.2;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;font-weight:600;line-height:1}
.small .tags{font-size:12px}
.tag{padding:3px 7px;border-radius:4px;background:var(--chip);color:#2B2F36}
.tag.gov{background:#1F7A4D;color:#fff}
.tag.eu{background:#E3F2EA;color:#14583A}
.tag.warn{background:#FFF1D6;color:#6B4A00}
.tag.type{background:var(--tag);color:var(--tagInk);padding:4px 8px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv div{display:flex;gap:8px;font-size:14px;line-height:1.35}
.kv span:first-child{flex:none;width:100px;color:var(--muted)}
.kv span:last-child{font-weight:700}
.small .kv div{font-size:13px;gap:6px}
.small .kv span:first-child{width:92px}
.note-s{font-size:13px;color:var(--muted)}
.seats{display:flex;flex-direction:column;gap:4px;padding-top:10px;margin-top:auto;border-top:1px solid var(--line2)}
.seats .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.seats .num{font-size:28px;font-weight:700;line-height:1}
.mini{display:flex;gap:3px;height:34px;margin-top:4px}
.mini div{flex:1;display:flex;justify-content:center;align-items:flex-end}
.mini i{display:block;width:100%;max-width:16px;border-radius:2px}
.yrs{display:flex;gap:3px;font-size:12px;color:var(--muted)}
.yrs span{flex:1;text-align:center}
.al{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;border:1px solid var(--line);border-top:5px solid #8A9099;border-radius:6px;background:#fff}
.al .members{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line2)}
.al .mlabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:#fff;border:1px solid #D5D3CC;border-radius:999px;font-size:14px;font-weight:600}
.filter{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding:2px 14px}
.filter label{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:600;cursor:pointer}
.filter input{width:20px;height:20px;margin:0;accent-color:var(--navy)}
.lg{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:6px}
.lg .t{display:flex;align-items:center;gap:8px}
.lg h3{margin:0;font-size:17px;font-weight:700}
.lg p{margin:0;font-size:14px;line-height:1.45;color:#2B2F36}
.count{margin-left:auto;padding:3px 9px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.status{padding:28px;text-align:center;font-size:17px}
button.toggle{min-height:44px;padding:0 18px;border:1px solid var(--navy);border-radius:999px;background:#fff;color:var(--navy);font:600 16px 'Advent Pro',system-ui,sans-serif;cursor:pointer}
button.toggle:hover{background:var(--navy);color:#fff}
button.toggle:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
footer{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.55}
footer p{margin:0 0 4px}
</style>
</head>

  }
  return ['#5B6170', '#FFFFFF'];
};

    const europarty = g(o, 'Europarty Affiliation'), europartyEnd = g(o, 'Europarty End');
    const epGroup = g(o, 'European Parliament Group');

      native: g(o, 'Name (Native)'), english: g(o, 'Name (English)') || g(o, 'Name (Native)'),

      abbr: g(o, 'Abbreviation') || g(o, 'Name (English)'), country: g(o, 'Country'),
      ideologies: ideology.split(/[,;]/).map((x) => x.trim()).filter(Boolean).map((x) => (/^libertarian$/i.test(x) ? 'Libertarianism' : x)).map((x) => ({ name: x, color: ideoColor(x) })),

    p.seatsNow = p.seats ? (p.seats[p.seats.length - 1] || 0) : 0;
    p.gov = (cfg.governingParties || []).includes(p.abbr);
  });
  return { list, merged };
}

async function wikiJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

}

  try { const c = JSON.parse(localStorage.getItem(cacheKey) || 'null'); if (c && Date.now() - c.t < LOGOS.cacheHours * 3600e3) return c.logos; } catch (e) { /* storage unavailable */ }

function parseElectionDate(raw) {

  barEl.querySelectorAll('div').forEach((d) => { const sg = PARL.segs[+d.dataset.i]; const n = sg.vals[i] || 0; d.style.flexGrow = n; d.title = `${sg.a}: ${n}`; });
  const live = PARL.segs.map((sg) => ({ a: sg.a, color: sg.color, n: sg.vals[i] || 0 })).filter((x) => x.n > 0);
  barEl.setAttribute('aria-label', `Seats ${y || ''}: ` + live.map((x) => `${x.a} ${x.n}`).join(', '));
  document.getElementById('parl-keys').innerHTML = live.map((x) => `<span><span class="dot" style="background:${x.color}"></span><strong>${esc(x.a)}</strong> ${x.n}</span>`).join('');
  const when = document.getElementById('parl-when');
  if (when && y) when.textContent = i === PARL.years.length - 1 && PARL.elected ? `elected ${PARL.elected}` : `${y} election`;
  document.querySelectorAll('.yrbtn').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
}
let parlTimer = null;
function bindParl() {
  if (!PARL) return;
  const last = PARL.years.length - 1;
  setParlYear(last);
  const btn = document.getElementById('parl-play');
  const label = (playing) => { btn.innerHTML = playing ? `${PAUSE_ICON}<span>Pause</span>` : `${PLAY_ICON}<span>Play ${PARL.years[0]}–${PARL.years[last]}</span>`; };
  const stop = () => { clearInterval(parlTimer); parlTimer = null; label(false); };
  if (btn) btn.onclick = () => {
    if (parlTimer) return stop();
    let i = 0; setParlYear(0); label(true);
    parlTimer = setInterval(() => { i++; setParlYear(i); if (i >= last) stop(); }, 1400);
  };
  document.querySelectorAll('.yrbtn').forEach((b) => { b.onclick = () => { if (parlTimer) stop(); setParlYear(+b.dataset.i); }; });
}
function viewPolling(cfg) {
  const p = cfg.polling; if (!p || !p.embed) return '';
  return bar('Polling average', `<a href="${esc(p.embed)}" target="_blank" rel="noopener">Get the data →</a>`) + `<section class="card poll">
    <iframe title="${esc(p.title || 'Polling average')}" aria-label="Line chart" src="${esc(p.embed)}" scrolling="no" height="${p.height || 400}" data-external="1"></iframe>
    ${p.note ? `<p>${esc(p.note)}</p>` : ''}</section>`;
}
function viewAlliances(alliances) {
  if (!alliances.length) return '';
  return bar('Multiparty alliances', '<span class="note">Electoral, parliamentary and governing alliances</span>') + `<div class="grid-a">${alliances.map((a) => `
    <article class="al" style="border-top-color:${a.color}" title="${esc(a.native)}">
      <div class="top" style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span class="abbr" style="font-size:22px">${esc(a.abbr)}</span><span class="yr">${a.since ? 'since ' + a.since : ''}</span></div>
      <div><h3 style="margin:0;font-size:16px;font-weight:700;line-height:1.25">${esc(a.english)}</h3><span class="muted" style="font-size:14px">${esc(a.native)}</span></div>
      <div class="kv"><div><span>Europarty</span><span>${esc(a.europarty)}</span></div>${a.epGroup ? `<div><span>EP group</span><span>${esc(a.epGroup)}</span></div>` : ''}</div>
      ${a.types.length ? `<div class="tags">${a.types.map((t) => `<span class="tag type">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="members"><span class="mlabel">${a.members.length} member parties</span><div class="chips">${a.members.map((m) => `<span class="chip" title="${esc(m.english)}"><span class="dot" style="width:9px;height:9px;background:${m.color}"></span>${esc(m.abbr)}</span>`).join('')}</div></div>
    </article>`).join('')}</div>`;
}
function tags(p) {
  const t = [];
  if (p.gov) t.push(`<span class="tag gov">In government</span>`);
  p.ideologies.forEach((i) => t.push(`<span class="tag" style="border:1px solid ${i.color};background:${i.color}1F;color:#1A1D23">${esc(i.name)}</span>`));
  if (p.eu) t.push(`<span class="tag eu">EU: ${esc(p.eu)}</span>`);
  if (p.status !== 'active') t.push(`<span class="tag warn">${esc(p.status.charAt(0).toUpperCase() + p.status.slice(1))}</span>`);
  if (!p.latest) t.push(`<span class="tag warn">Earlier version</span>`);
  return `<div class="tags">${t.join('')}</div>`;
}
const kv = (rows) => rows.length ? `<div class="kv">${rows.map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>` : '';
function bigTile(p, years) {
  if (!p.seats) { const affs0 = p.affs.length ? p.affs : [['Affiliation', 'None']];
    return `<article class="tile" style="border-top-color:${p.color}" title="${esc(p.native)}"><div class="top"><span class="nm">${logoImg(p, 32)}<span class="abbr">${esc(p.abbr)}</span></span><span class="yr">${p.founded ? 'est. ' + p.founded : ''}</span></div><h3>${esc(p.english)}</h3>${tags(p)}${kv(affs0)}</article>`; }
  const max = Math.max(1, ...p.seats.map((v) => v || 0));
  const yy = years.map((y) => '’' + String(y).slice(2));
  const hist = p.seats.map((v, i) => `${years[i]}: ${v == null ? 'did not contest' : v}`).join(', ');
  const affs = p.affs.length ? p.affs : [['Affiliation', 'None']];
  return `<article class="tile" style="border-top-color:${p.color}" title="${esc(p.native)}">
    <div class="top"><span class="nm">${logoImg(p, 32)}<span class="abbr">${esc(p.abbr)}</span></span><span class="yr">${p.founded ? 'est. ' + p.founded : ''}</span></div>
    <h3>${esc(p.english)}</h3>${tags(p)}${kv(affs)}
    <div class="seats"><span class="lbl">SEATS ${years[years.length - 1]}</span><span class="num">${p.seatsNow}</span>
      <div class="mini" role="img" aria-label="Seats ${esc(hist)}">${p.seats.map((v) => `<div><i style="height:${v ? Math.max(3, Math.round(v / max * 34)) : 2}px;background:${v ? p.color : '#E4E2DB'}"></i></div>`).join('')}</div>
      <div class="yrs" aria-hidden="true">${yy.map((y) => `<span>${y}</span>`).join('')}</div></div></article>`;
}
function smallTile(p, years) {
  const past = p.seats ? p.seats.map((v, i) => ({ v, y: years[i] })).filter((x) => x.v) : [];
  return `<article class="tile small" style="border-top-color:${p.color}" title="${esc(p.native)}">
    <div class="top"><span class="nm">${logoImg(p, 24)}<span class="abbr">${esc(p.abbr)}</span></span><span class="yr">${esc(p.founded)}</span></div>
    <h3>${esc(p.english)}</h3>${tags(p)}${kv(p.affs)}
    ${past.length ? `<span class="note-s">${past.map((x) => `${x.v} seat${x.v > 1 ? 's' : ''} in ${x.y}`).join(', ')}</span>` : ''}</article>`;
}
function viewParties(parties, cfg, activeOnly) {
  const years = (cfg.seats && cfg.seats.years) || [];
  const vis = parties.filter((p) => !activeOnly || (p.status === 'active' && p.latest));
  const hidden = parties.length - parties.filter((p) => p.status === 'active' && p.latest).length;
  const hasSeats = !!(cfg.seats && cfg.seats.parties);
  const isMajor = (p) => (hasSeats ? p.seatsNow > 0 : p.european);
  const major = vis.filter(isMajor).sort((a, b) => b.seatsNow - a.seatsNow || b.affs.length - a.affs.length || a.english.localeCompare(b.english));
  const minor = vis.filter((p) => !isMajor(p)).sort((a, b) => (b.seats ? 1 : 0) - (a.seats ? 1 : 0) || a.english.localeCompare(b.english));
  const filter = `<div class="card filter"><label for="active-only"><input id="active-only" type="checkbox" ${activeOnly ? 'checked' : ''}> Active parties only</label>
    <span class="muted" style="font-size:14px">${activeOnly ? `${hidden} inactive, renamed or earlier records hidden` : 'Including inactive, renamed and earlier records'}</span></div>`;
  return bar(hasSeats ? 'In national parliament' : 'Parties with a European affiliation', `<span class="note">Top colour = Europarty${hasSeats ? ' · seats over time' : ''}</span>`) + filter +
    `<div class="grid-p">${major.map((p) => bigTile(p, years)).join('')}</div>` +
    bar(`Other parties · ${minor.length}`, `<span class="note">${hasSeats ? 'No seats in the current parliament' : 'No European affiliation'} · hover for the native name</span>`) +
    `<div class="grid-m">${minor.map((p) => smallTile(p, years)).join('')}</div>`;
}
function viewLegend(parties, showAll) {
  const key = (x) => norm(x).replace(/-/g, ' ');
  const live = parties.filter((p) => p.status === 'active' && p.latest);
  const count = (name) => live.filter((p) => p.ideologies.some((i) => key(i.name) === key(name))).length;
  const items = IDEOLOGIES.map(([n, c, t]) => ({ n, c, t, k: count(n) }));
  const present = items.filter((i) => i.k > 0);
  const shown = showAll ? items : present;
  // Ideologies used in this country that have no legend definition yet
  const known = new Set(IDEOLOGIES.map(([n]) => key(n)));
  const undef = {};
  live.forEach((p) => p.ideologies.forEach((i) => { if (!known.has(key(i.name))) undef[i.name] = (undef[i.name] || 0) + 1; }));
  const undefTxt = Object.entries(undef).map(([n, k]) => `${esc(n)} (${k})`).join(', ');
  const hiddenCount = items.length - present.length;
  return bar('Ideology legend', `<span class="note">${showAll ? 'All ideologies · those present in this country are marked' : 'Ideologies of the parties on this page'}</span>`) +
    (shown.length ? `<div class="grid-a">${shown.map(({ n, c, t, k }) => `<div class="lg" style="background:${c}12">
      <div class="t"><span class="dot" style="width:14px;height:14px;background:${c}"></span><h3>${esc(n)}</h3>${k ? `<span class="count">${k} ${k === 1 ? 'party' : 'parties'} here</span>` : ''}</div>
      <p>${esc(t)}</p></div>`).join('')}</div>` : '') +
    (undefTxt ? `<p class="note-s" style="margin:0">Also used here, without a legend definition yet: ${undefTxt}.</p>` : '') +
    (hiddenCount ? `<div><button type="button" id="legend-toggle" class="toggle" aria-expanded="${showAll}">${showAll ? 'Show only ideologies in this country' : `Show all ${items.length} ideologies`}</button></div>` : '');
}

/* ---------- App ---------- */
const params = new URLSearchParams(location.search);
const ISO = (params.get('country') || 'AL').toUpperCase();
const app = document.getElementById('app');
let state = { activeOnly: true, showAllIdeo: false };

async function main() {
  const cfg = COUNTRIES[ISO] || {};
  let partyRows, allianceRows = [];
  const loadWithFallback = async (src) => {
    try { return await loadSheet(src); }
    catch (e) { if (!src.publishedCsv) throw e; console.warn('Published CSV failed, trying gviz', e); return loadSheet({ sheetId: src.sheetId, gid: src.gid, publishedCsv: '' }); }
  };
  try { partyRows = await loadWithFallback(SOURCES.parties); }
  catch (e) { app.innerHTML = `<div class="card status">Couldn't load the party sheet (${esc(e.message)}). Check that it is shared as “Anyone with the link can view” or published to the web.</div>`; postHeight(); return; }
  try { allianceRows = await loadWithFallback(SOURCES.alliances); } catch (e) { console.warn('Alliance sheet not loaded', e); }
  let calendarRows = [];
  try { calendarRows = await loadWithFallback(SOURCES.calendar); } catch (e) { console.warn('Calendar sheet not loaded', e); }
  const { list: parties, merged } = buildParties(partyRows, ISO, cfg);
  cfg.name = cfg.name || (parties[0] && parties[0].country) || ISO;
  document.title = `Europe Elects – ${cfg.name}`;
  const current = parties.filter((p) => p.latest);
  const elections = buildElections(calendarRows, cfg.name);
  const alliances = buildAlliances(allianceRows, ISO, parties);
  alliances.forEach((a) => a.members.forEach((m) => { if (m.party && !m.party.affs.some((x) => x[0] === 'Alliance')) m.party.affs.push(['Alliance', a.abbr]); }));

  const render = () => {
    app.innerHTML = viewHeader(cfg) + viewElections(cfg, elections) + viewParliament(cfg, current) + viewPolling(cfg) +
      viewAlliances(alliances) + `<div id="parties" style="display:contents">${viewParties(parties, cfg, state.activeOnly)}</div>` + `<div id="legend" style="display:contents">${viewLegend(parties, state.showAllIdeo)}</div>` +
      `<footer><p>Sources: Europe Elects <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SOURCES.parties.gid}" target="_blank" rel="noopener">party database</a> and <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SOURCES.alliances.gid}" target="_blank" rel="noopener">alliance sheet</a> and <a href="https://docs.google.com/spreadsheets/d/${SOURCES.calendar.sheetId}/edit?gid=${SOURCES.calendar.gid}" target="_blank" rel="noopener">electoral calendar</a> (loaded live); seats, government and polling from Europe Elects.</p>
      <p>Party labels show Europarty, EP group, documented EP group links and international affiliations; the EP seat projection assignment and orientation columns are not used.${merged.length ? ' Duplicate records merged: ' + esc(merged.join('; ')) + '.' : ''}<span id="logo-credit"></span></p></footer>`;
    bindFilter(); bindLegend(); bindParl();
    postHeight();
  };
  const bindLegend = () => {
    const btn = document.getElementById('legend-toggle');
    if (btn) btn.addEventListener('click', () => {
      state.showAllIdeo = !state.showAllIdeo;
      document.getElementById('legend').innerHTML = viewLegend(parties, state.showAllIdeo);
      bindLegend(); postHeight();
    });
  };
  const bindFilter = () => {
    const box = document.getElementById('active-only');
    if (box) box.addEventListener('change', () => {
      state.activeOnly = box.checked;
      document.getElementById('parties').innerHTML = viewParties(parties, cfg, state.activeOnly);
      bindFilter(); postHeight();
    });
  };
  render();
  if (LOGOS.enabled) {
    loadLogos(parties, cfg.name).then((logos) => {
      parties.forEach((p) => { p.logo = logos[p.versionId] || ''; });
      if (!Object.keys(logos).length) return;
      document.getElementById('parties').innerHTML = viewParties(parties, cfg, state.activeOnly);
      document.getElementById('logo-credit').textContent = ' Party logos from Wikimedia Commons via Wikidata.';
      bindFilter(); postHeight();
    }).catch((e) => console.warn('Logos not loaded', e));
  }
}

/* ---------- iframe height: works with the standard Datawrapper resize snippet ---------- */
function postHeight() {
  if (window.parent === window) return;
  window.parent.postMessage({ 'datawrapper-height': { ['ee-' + ISO.toLowerCase()]: document.documentElement.scrollHeight } }, '*');
}
if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);
window.addEventListener('load', postHeight);
// Resize embedded Datawrapper charts (polling) inside this page.
window.addEventListener('message', (e) => {
  const d = e.data && e.data['datawrapper-height']; if (!d) return;
  document.querySelectorAll('iframe').forEach((f) => { if (f.contentWindow === e.source) for (const k in d) f.style.height = d[k] + 'px'; });
});

main();
</script>
</body>
