# Pollster ratings: compares each pollster's last poll before past elections with the official results
# entered in the "Results" tab of the ratings Sheet, and writes the "Ratings" and "Detail" tabs.
# Runs once a day and on demand (Actions › Pollster ratings › Run workflow).
# Needs: secret RATINGS_SHEET_ID; the Sheet shared with the service account below as EDITOR.
name: Pollster ratings

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the poll database (private)
        uses: actions/checkout@v4
        with:
          repository: Europe-Elects/apopod
          token: ${{ secrets.APOPOD_TOKEN }}
          path: apopod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659866385408/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ee-sheets-reader@project-6c08a079-4a01-46eb-aaf.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          create_credentials_file: false

      - name: Rate the pollsters
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          RATINGS_SHEET_ID: ${{ secrets.RATINGS_SHEET_ID }}
        run: python3 scripts/rate_pollsters.py apopod
