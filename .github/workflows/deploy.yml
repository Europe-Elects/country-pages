# Builds the polling averages from the private poll database (Europe-Elects/apopod)
# and publishes the country pages to GitHub Pages.
# Also reads the Google Sheets (party database, calendar, EP projection) with a keyless Google login and
# publishes them as sheets/*.csv|json, so the pages never contact Google.
# Runs on every change to this repository, every hour, and on demand (Actions › Build and deploy › Run workflow).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the country pages
        uses: actions/checkout@v4

      - name: Check out the poll database (private)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Europe-Elects/apopod
          token: ${{ secrets.APOPOD_TOKEN }}
          path: apopod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659866385408/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ee-sheets-reader@project-6c08a079-4a01-46eb-aaf.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false

      - name: Read the Google Sheets
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          PARTY_DB_SHEET_ID: ${{ secrets.PARTY_DB_SHEET_ID }}
          CALENDAR_SHEET_ID: ${{ secrets.CALENDAR_SHEET_ID }}
          PROJECTION_SHEET_ID: ${{ secrets.PROJECTION_SHEET_ID }}
          HEADLINE_SHEET_ID: ${{ secrets.HEADLINE_SHEET_ID }}
        run: python3 scripts/fetch_sheets.py site/sheets

      - name: Assemble the site
        run: |
          mkdir -p site
          python3 scripts/build_home.py
          python3 scripts/build_africa_home.py
          cp index.html site/
          for f in home.js home.html live.html africa-home.js africa-home.html; do [ -f "$f" ] && cp "$f" site/ || true; done
          [ -d home ] && cp -r home site/ || true
          [ -f EMBED-CODES.md ] && cp EMBED-CODES.md site/ || true
          python3 scripts/build_polling.py apopod site/polling

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
